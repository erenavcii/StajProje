<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-4">
          <h4 class="card-title mb-4">{{ isEditMode ? 'Fatura Düzenle' : 'Yeni Fatura' }}</h4>

          <div class="mb-3">
            <label class="form-label">Müşteri ID</label>
            <input type="number" class="form-control" [(ngModel)]="invoice.customerId" placeholder="Müşteri ID girin" />
          </div>

          <div class="mb-3">
            <label class="form-label">Fatura No</label>
            <input type="text" class="form-control" [(ngModel)]="invoice.invoiceNumber" placeholder="FTR-2024-001" />
          </div>

          <div class="mb-3">
            <label class="form-label">Fatura Tarihi</label>
            <input type="date" class="form-control" [(ngModel)]="invoice.invoiceDate" />
          </div>

          <div class="mb-3">
            <label class="form-label">Toplam Tutar</label>
            <input type="number" class="form-control" [(ngModel)]="invoice.totalAmount" placeholder="0.00" />
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary w-100" (click)="save()">
              {{ isEditMode ? 'Güncelle' : 'Kaydet' }}
            </button>
            <button class="btn btn-outline-secondary w-100" (click)="cancel()">İptal</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
